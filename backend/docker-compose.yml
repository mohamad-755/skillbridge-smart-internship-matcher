version: '3.8'

services:
  app:
    build: .
    container_name: skillbridge-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/skillbridge
      - DATABASE_USERNAME=skillbridge
      - DATABASE_PASSWORD=skillbridge
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SQL_INIT_MODE=never
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: skillbridge-db
    environment:
      - POSTGRES_DB=skillbridge
      - POSTGRES_USER=skillbridge
      - POSTGRES_PASSWORD=skillbridge
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_postgres_data:/var/lib/postgresql/data

volumes:
  skillbridge_postgres_data: